name: TicketNotify CI & Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          TESTING: "True"
          BOT_TOKEN: "9094648730:AAGav3MwDbYgAABKejC0XUQwy9OupjJe2A0"
          ADMIN_ID: "1483331491"
        run: |
          python -m pytest -v
